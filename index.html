<title>나인어클락 상세페이지 1차 시안</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: #f2f2f0; color: #17181d; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; word-break: keep-all; }
  main { max-width: 1040px; margin: 0 auto; padding: 40px 16px 56px; }
  h1 { margin: 0; font-size: 24px; line-height: 1.35; font-weight: 800; letter-spacing: -0.02em; }
  .lead { margin: 10px 0 28px; font-size: 16px; line-height: 1.6; color: #555a63; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
  .card { display: grid; gap: 6px; padding: 0 0 20px; border-radius: 16px; overflow: hidden; background: #fff; color: inherit; text-decoration: none; box-shadow: 0 6px 20px rgba(20, 22, 27, .08); }
  .card:focus-visible { outline: 3px solid #17181d; outline-offset: 3px; }
  .card img { display: block; width: 100%; height: auto; margin-bottom: 10px; }
  .name, .desc, .go { margin: 0 20px; }
  .name { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
  .desc { font-size: 15px; line-height: 1.55; color: #555a63; }
  .go { justify-self: start; margin-top: 10px; padding: 12px 22px; border-radius: 10px; background: #17181d; color: #fff; font-size: 16px; font-weight: 700; }
  .note { margin: 28px 0 0; font-size: 14px; line-height: 1.6; color: #6b707a; }
</style>
</head>
<body>
<main>
  <h1>나인어클락 상세페이지 1차 시안</h1>
  <p class="lead">구성과 문구는 같고 색감만 다른 두 가지 시안이에요. 누르면 스마트스토어 상품 화면처럼 보실 수 있어요.</p>
  <div class="grid">
    <a class="card" href="a/">
      <img src="a.jpg" alt="A안 · 선명한 색감 첫 화면: 신발끈 교구와 행복한 마을" width="896" height="643">
      <span class="name">A안 · 선명한 색감</span>
      <span class="desc">제품의 빨강과 게임의 하늘색을 크게 쓴 색감</span>
      <span class="go">A안 보기</span>
    </a>
    <a class="card" href="b/">
      <img src="b.jpg" alt="B안 · 고급형 색감 첫 화면: 신발끈 교구와 행복한 마을" width="896" height="643">
      <span class="name">B안 · 고급형 색감</span>
      <span class="desc">흰색과 연회색 바탕에 강조색만 얹은 차분한 색감</span>
      <span class="go">B안 보기</span>
    </a>
  </div>
  <p class="note">시안 미리보기 화면이에요. 실제 판매 페이지가 아니에요.</p>
</main>
