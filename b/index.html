<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>나인어클락 상세페이지 1차 시안 · B안 · 고급형 색감</title>
<style>
  /* 스마트스토어 상품 화면의 구조를 따른 시안 미리보기. 맨 위 검은 줄만 우리 것(시안 표시, 색감·화면 전환)이고 그 아래는 상품 화면을 따라 했다.
     네이버 로고·N pay 표시는 쓰지 않고, 리뷰·가격은 지어내지 않는다. */
  :root { color-scheme: light; --ink: #222222; --sub: #767678; --faint: #929294; --line: #e5e5e5; --band: #f4f4f5; --green: #03c75a; --ground: #e9e9eb;
          --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", "Noto Sans KR", system-ui, sans-serif; }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; word-break: keep-all; overflow-wrap: break-word; -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid #1a73e8; outline-offset: 2px; }
  [hidden] { display: none !important; }
  svg { display: block; }

  /* 맨 위: 시안 조작 줄 (우리 것) */
  .ctl { background: #17181d; color: #ffffff; }
  .ctl-in { max-width: 1080px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
  .ctl b { margin-right: auto; font-size: 13px; font-weight: 700; }
  .ctl a.home { font-size: 13px; color: #cfd2da; }
  .seg { display: inline-flex; padding: 3px; border-radius: 9px; background: #2b2d35; }
  .seg button, .seg a { display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border-radius: 7px; font-size: 14px; font-weight: 600; color: #b9bdc7; text-decoration: none; }
  .seg [aria-pressed="true"], .seg [aria-current="page"] { background: #ffffff; color: #17181d; }
  @media (max-width: 899px) { .ctl .view { display: none; } }

  .col { position: relative; width: min(100%, 430px); min-height: 100vh; margin: 0 auto; background: #ffffff; }
  .col.pc { width: min(100%, 1080px); }

  /* 스토어 머리줄 */
  .shead { display: flex; align-items: center; gap: 2px; height: 52px; padding: 0 6px 0 4px; border-bottom: 1px solid var(--line); }
  .shead .ic { display: grid; place-items: center; width: 44px; height: 44px; }
  .shead strong { flex: 1; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
  .sfield { display: none; }
  .snav { display: flex; gap: 22px; padding: 0 16px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  .snav::-webkit-scrollbar { display: none; }
  .snav button { flex: none; height: 44px; font-size: 15px; color: var(--sub); white-space: nowrap; border-bottom: 2px solid transparent; }
  .snav button[aria-pressed="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--ink); }
  .col.pc .shead { height: 88px; padding: 0 24px; gap: 14px; }
  .col.pc .shead .back, .col.pc .shead .srch { display: none; }
  .col.pc .shead strong { font-size: 28px; }
  .col.pc .sfield { display: flex; align-items: center; justify-content: space-between; width: 280px; height: 40px; padding: 0 14px 0 18px; border: 1px solid #d3d5d7; border-radius: 20px; color: var(--faint); font-size: 14px; }
  .col.pc .snav { gap: 30px; padding: 0 24px; }
  .col.pc .snav button { height: 52px; font-size: 16px; }

  /* 대표이미지와 상품 정보 */
  .gal { position: relative; }
  .track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .track::-webkit-scrollbar { display: none; }
  .track img { flex: 0 0 100%; width: 100%; height: auto; aspect-ratio: 1; object-fit: cover; scroll-snap-align: start; }
  .count { position: absolute; right: 12px; bottom: 12px; padding: 2px 10px; border-radius: 999px; background: rgba(0, 0, 0, .5); color: #ffffff; font-size: 12px; font-variant-numeric: tabular-nums; }
  .thumbs { display: none; }
  .pinfo { padding: 18px 16px 20px; }
  .pinfo .store { margin: 0; font-size: 13px; color: var(--sub); }
  .pinfo h1 { margin: 6px 0 0; font-size: 18px; line-height: 1.4; font-weight: 500; letter-spacing: -0.02em; }
  .pinfo .rev { margin: 6px 0 0; font-size: 13px; color: var(--faint); }
  .pinfo .price { margin: 14px 0 0; font-size: 24px; line-height: 1.3; font-weight: 700; letter-spacing: -0.02em; }
  .rows { display: grid; gap: 8px; margin: 16px 0 0; padding: 14px 0 0; border-top: 1px solid #f0f0f0; font-size: 14px; }
  .rows div { display: grid; grid-template-columns: 56px 1fr; }
  .rows dt { color: var(--sub); }
  .rows dd { margin: 0; }
  .buybox { display: none; }
  .gapband { height: 8px; background: var(--band); }
  .col.pc .top { display: grid; grid-template-columns: 480px minmax(0, 1fr); gap: 48px; padding: 36px 24px 44px; }
  .col.pc .track { overflow: hidden; border: 1px solid #f0f0f0; }
  .col.pc .track img { display: none; }
  .col.pc .track img.on { display: block; }
  .col.pc .count { display: none; }
  .col.pc .thumbs { display: flex; gap: 8px; margin-top: 12px; }
  .thumbs button { width: 70px; height: 70px; border: 1px solid var(--line); opacity: .55; }
  .thumbs button[aria-pressed="true"] { border-color: var(--ink); opacity: 1; }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; }
  .col.pc .pinfo { padding: 4px 0 0; }
  .col.pc .pinfo h1 { font-size: 22px; }
  .col.pc .pinfo .price { margin-top: 18px; font-size: 30px; }
  .col.pc .buybox { display: block; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
  .qty, .total { display: flex; align-items: center; justify-content: space-between; font-size: 15px; }
  .stepper { display: inline-flex; align-items: center; border: 1px solid #d3d5d7; border-radius: 4px; }
  .stepper button { width: 36px; height: 36px; font-size: 18px; color: var(--sub); }
  .stepper b { min-width: 44px; text-align: center; font-weight: 500; }
  .total { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
  .total b { font-size: 24px; letter-spacing: -0.02em; }
  .btns { display: grid; gap: 8px; margin-top: 20px; }
  .go { height: 52px; border-radius: 6px; background: var(--green); color: #ffffff; font-size: 17px; font-weight: 700; }
  .trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .trio button { height: 48px; border: 1px solid #d3d5d7; border-radius: 6px; font-size: 15px; }
  .col.pc .gapband { display: none; }

  /* 탭과 상세정보 */
  .tabs { position: sticky; top: 0; z-index: 3; display: grid; grid-template-columns: repeat(4, 1fr); background: #ffffff; border-bottom: 1px solid var(--line); }
  .tabs button { height: 46px; font-size: 14px; letter-spacing: -0.02em; color: var(--sub); border-bottom: 2px solid transparent; }
  .tabs button[aria-pressed="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--ink); }
  .col.pc .tabs { margin: 0 24px; border-top: 1px solid var(--line); }
  .col.pc .tabs button { height: 58px; font-size: 16px; }
  .dwrap { position: relative; }
  .detail { overflow: hidden; line-height: 0; }
  .detail.fold { max-height: var(--fold, 1380px); }
  .detail img { display: block; width: 100%; height: auto; }
  .col.pc .dwrap { width: 860px; max-width: 100%; margin: 40px auto 0; }
  .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 110px; background: linear-gradient(180deg, rgba(255, 255, 255, 0), #ffffff); pointer-events: none; }
  .more { display: flex; align-items: center; justify-content: center; gap: 6px; width: calc(100% - 32px); max-width: 828px; height: 50px; margin: 12px auto 24px; border: 1px solid #c9cbce; border-radius: 4px; background: #ffffff; font-size: 15px; font-weight: 600; }
  .sect { padding: 28px 16px 32px; border-top: 8px solid var(--band); }
  .sect h2 { margin: 0 0 14px; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
  .sect h2 span { margin-left: 4px; font-weight: 400; color: var(--faint); }
  .empty { margin: 0; padding: 34px 0; text-align: center; font-size: 14px; color: var(--faint); }
  .kv { width: 100%; border-collapse: collapse; font-size: 14px; }
  .kv th, .kv td { padding: 12px; border: 1px solid #eeeeee; text-align: left; vertical-align: top; }
  .kv th { width: 108px; font-weight: 400; color: var(--sub); background: #fafafa; }
  .kv .ph { color: var(--faint); }
  .col.pc .sect { padding: 44px 24px 48px; }
  .pfoot { margin: 0; padding: 22px 16px 28px; border-top: 8px solid var(--band); font-size: 12px; line-height: 1.6; color: var(--faint); text-align: center; }

  /* 아래 구매 줄 (휴대폰 화면) */
  .totop { position: sticky; bottom: 76px; z-index: 4; display: grid; place-items: center; width: 44px; height: 44px; margin: 0 12px 8px auto; border: 1px solid var(--line); border-radius: 50%; background: #ffffff; box-shadow: 0 2px 8px rgba(0, 0, 0, .12); }
  .buy { position: sticky; bottom: 0; z-index: 4; display: flex; align-items: center; gap: 2px; padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px)); background: #ffffff; border-top: 1px solid var(--line); }
  .buy .mini { display: grid; justify-items: center; align-content: center; gap: 1px; width: 54px; height: 48px; font-size: 11px; color: var(--sub); }
  .buy .go { flex: 1; height: 48px; margin-left: 6px; }
  .col.pc .buy { display: none; }
  .col.pc .totop { bottom: 20px; }
  .toast { position: fixed; left: 50%; bottom: 88px; z-index: 9; transform: translateX(-50%); padding: 10px 18px; border-radius: 999px; background: rgba(34, 34, 34, .92); color: #ffffff; font-size: 14px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>


<div class="ctl">
  <div class="ctl-in">
    <b>시안 미리보기</b>
    <a class="home" id="home" hidden>색감 고르는 화면</a>
    <div class="seg" id="vseg" role="group" aria-label="색감 고르기" hidden></div>
    <div class="seg view" role="group" aria-label="보기 크기">
      <button type="button" id="v-phone" aria-pressed="true">휴대폰</button>
      <button type="button" id="v-pc" aria-pressed="false">PC</button>
    </div>
  </div>
</div>

<main class="col" id="col">
  <header class="shead">
    <span class="ic back" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></span>
    <strong>나인어클락</strong>
    <span class="sfield" aria-hidden="true">스토어 내 검색<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#929294" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg></span>
    <span class="ic srch" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg></span>
    <span class="ic" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.3 11h10.2l2-8H6.4"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg></span>
  </header>
  <nav class="snav" id="snav" aria-label="상품 고르기"></nav>
  <div id="pages"></div>
  <button type="button" class="totop" id="totop" aria-label="맨 위로" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
  <div class="buy">
    <button type="button" class="mini act"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#767678" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-9.6A4 4 0 0112 8a4 4 0 017 2.4C19 15.6 12 20 12 20z"/></svg>찜</button>
    <button type="button" class="mini act"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#767678" stroke-width="1.8" stroke-linejoin="round"><path d="M4 6.5A2.5 2.5 0 016.5 4h11A2.5 2.5 0 0120 6.5v7a2.5 2.5 0 01-2.5 2.5H11l-4.5 3.5V16A2.5 2.5 0 014 13.5z"/></svg>톡톡</button>
    <button type="button" class="go act">구매하기</button>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
  const DATA = {"shoe": {"short": "신발끈 교구", "name": "신발끈 묶기 연습 교구", "store": "나인어클락", "price": "가격 미정", "rows": [["배송", "택배배송 · 배송비 미정"], ["옵션", "1개입 · 2개입"]], "gallery": ["img/shoe/thumb1.jpg", "img/shoe/thumb2.jpg", "img/shoe/thumb3.jpg", "img/shoe/thumb4.jpg"], "spec": "가로 848px · 이미지 15장 (움직이는 그림 3개) · 세로 28,569px", "files": [{"src": "img/shoe/01.gif", "w": 848, "h": 1486}, {"src": "img/shoe/02.jpg", "w": 848, "h": 2784}, {"src": "img/shoe/03.jpg", "w": 848, "h": 2670}, {"src": "img/shoe/04.gif", "w": 848, "h": 613}, {"src": "img/shoe/05.jpg", "w": 848, "h": 2795}, {"src": "img/shoe/06.jpg", "w": 848, "h": 1738}, {"src": "img/shoe/07.jpg", "w": 848, "h": 1763}, {"src": "img/shoe/08.jpg", "w": 848, "h": 1519}, {"src": "img/shoe/09.jpg", "w": 848, "h": 2971}, {"src": "img/shoe/10.gif", "w": 848, "h": 1074}, {"src": "img/shoe/11.jpg", "w": 848, "h": 2002}, {"src": "img/shoe/12.jpg", "w": 848, "h": 1267}, {"src": "img/shoe/13.jpg", "w": 848, "h": 2233}, {"src": "img/shoe/14.jpg", "w": 848, "h": 2218}, {"src": "img/shoe/15.jpg", "w": 848, "h": 1436}]}, "app": {"short": "행복한 마을", "name": "행복한 마을", "store": "나인어클락", "price": "가격 미정", "rows": [["배송", "배송 없음 · 구매 후 이용 링크 발송"]], "gallery": ["img/app/thumb1.jpg", "img/app/thumb2.jpg", "img/app/thumb3.jpg"], "spec": "가로 848px · 이미지 18장 (움직이는 그림 3개) · 세로 33,400px", "files": [{"src": "img/app/01.jpg", "w": 848, "h": 730}, {"src": "img/app/02.gif", "w": 848, "h": 1658}, {"src": "img/app/03.jpg", "w": 848, "h": 2096}, {"src": "img/app/04.jpg", "w": 848, "h": 1446}, {"src": "img/app/05.jpg", "w": 848, "h": 1581}, {"src": "img/app/06.gif", "w": 848, "h": 1533}, {"src": "img/app/07.jpg", "w": 848, "h": 2751}, {"src": "img/app/08.jpg", "w": 848, "h": 2050}, {"src": "img/app/09.gif", "w": 848, "h": 1359}, {"src": "img/app/10.jpg", "w": 848, "h": 1776}, {"src": "img/app/11.jpg", "w": 848, "h": 2325}, {"src": "img/app/12.jpg", "w": 848, "h": 1128}, {"src": "img/app/13.jpg", "w": 848, "h": 2152}, {"src": "img/app/14.jpg", "w": 848, "h": 1994}, {"src": "img/app/15.jpg", "w": 848, "h": 2065}, {"src": "img/app/16.jpg", "w": 848, "h": 2704}, {"src": "img/app/17.jpg", "w": 848, "h": 2543}, {"src": "img/app/18.jpg", "w": 848, "h": 1509}]}};
  const VARIANT = {"cur": "b", "home": "../", "items": [{"k": "a", "label": "A안", "href": "../a/"}, {"k": "b", "label": "B안", "href": "../b/"}]};
  const KEYS = Object.keys(DATA);
  const col = document.getElementById("col");
  const pages = document.getElementById("pages");
  const toast = document.getElementById("toast");
  const totop = document.getElementById("totop");
  const calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const DOWN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
  const UP = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>';
  const pos = {};
  let cur = null;
  let timer = 0;

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text) n.textContent = text;
    return n;
  }

  function say(msg) {
    toast.textContent = msg;
    toast.classList.add("on");
    clearTimeout(timer);
    timer = setTimeout(() => toast.classList.remove("on"), 1800);
  }
  const notYet = () => say("시안 미리보기라서 눌러도 넘어가지 않아요");

  function build(key) {
    const d = DATA[key];
    const page = el("article");
    page.id = "pg-" + key;
    page.hidden = true;

    // 대표이미지: 휴대폰은 옆으로 넘기고, PC는 작은 그림을 눌러 바꾼다
    const gal = el("div", "gal");
    const track = el("div", "track");
    const count = el("span", "count", "1/" + d.gallery.length);
    const thumbs = el("div", "thumbs");
    function pick(i) {
      [...track.children].forEach((im, k) => im.classList.toggle("on", k === i));
      [...thumbs.children].forEach((b, k) => b.setAttribute("aria-pressed", String(k === i)));
    }
    d.gallery.forEach((src, i) => {
      const im = new Image(860, 860);
      im.alt = d.name + " 대표이미지 " + (i + 1);
      if (i === 0) im.className = "on"; else im.loading = "lazy";
      im.src = src;
      track.append(im);
      const b = el("button");
      b.type = "button";
      b.setAttribute("aria-pressed", String(i === 0));
      b.setAttribute("aria-label", "대표이미지 " + (i + 1) + " 보기");
      const t = new Image(70, 70);
      t.alt = "";
      t.loading = "lazy";
      t.src = src;
      b.append(t);
      b.addEventListener("click", () => pick(i));
      thumbs.append(b);
    });
    track.addEventListener("scroll", () => {
      const i = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
      count.textContent = Math.min(d.gallery.length, i + 1) + "/" + d.gallery.length;
    }, { passive: true });
    gal.append(track, count, thumbs);

    const info = el("div", "pinfo");
    const rows = el("dl", "rows");
    d.rows.forEach(([k, v]) => { const r = el("div"); r.append(el("dt", "", k), el("dd", "", v)); rows.append(r); });
    info.append(el("p", "store", d.store), el("h1", "", d.name), el("p", "rev", "리뷰 0"), el("p", "price", d.price), rows);

    const box = el("div", "buybox");
    box.innerHTML = '<div class="qty"><span>수량</span><span class="stepper"><button type="button" aria-label="수량 줄이기">−</button><b>1</b><button type="button" aria-label="수량 늘리기">+</button></span></div>'
      + '<div class="total"><span>총 상품 금액</span><b></b></div>'
      + '<div class="btns"><button type="button" class="go">구매하기</button><div class="trio"><button type="button">톡톡문의</button><button type="button">찜하기</button><button type="button">장바구니</button></div></div>';
    box.querySelector(".total b").textContent = d.price;
    box.querySelectorAll("button").forEach(b => b.addEventListener("click", notYet));
    const side = el("div", "side");
    side.append(info, box);
    const top = el("div", "top");
    top.append(gal, side);

    // 탭: 누르면 그 구역으로 내려간다
    const tabs = el("nav", "tabs");
    tabs.setAttribute("aria-label", "상품 정보 메뉴");
    [["detail", "상세정보"], ["review", "리뷰 0"], ["qna", "Q&A 0"], ["return", "반품/교환정보"]].forEach(([id, label], i) => {
      const b = el("button", "", label);
      b.type = "button";
      b.dataset.to = id;
      b.setAttribute("aria-pressed", String(i === 0));
      b.addEventListener("click", () => {
        const t = page.querySelector('[data-sec="' + id + '"]');
        window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY - tabs.offsetHeight + 2, behavior: calm ? "auto" : "smooth" });
      });
      tabs.append(b);
    });

    // 상세정보: 네이버 기준(3,000px)에서 접어 두고 '상세정보 펼쳐보기'로 편다
    const dsec = el("section");
    dsec.dataset.sec = "detail";
    const wrap = el("div", "dwrap");
    const detail = el("div", "detail fold");
    const fade = el("div", "fade");
    d.files.forEach((f, i) => {
      const im = new Image(f.w, f.h);
      im.alt = d.name + " 상세 이미지 " + (i + 1) + "번";
      im.decoding = "async";
      im.loading = i < 2 ? "eager" : "lazy";
      im.src = f.src;
      detail.append(im);
    });
    const more = el("button", "more");
    more.type = "button";
    function setFold(on) {
      detail.classList.toggle("fold", on);
      fade.hidden = !on;
      more.innerHTML = (on ? "상세정보 펼쳐보기" : "상세정보 접기") + (on ? DOWN : UP);
      more.setAttribute("aria-expanded", String(!on));
    }
    more.addEventListener("click", () => {
      const on = !detail.classList.contains("fold");
      setFold(on);
      if (on) window.scrollTo(0, tabs.getBoundingClientRect().top + window.scrollY);
      tick();
    });
    setFold(true);
    wrap.append(detail, fade);
    dsec.append(wrap, more);

    function sect(id, title, n, msg) {
      const s = el("section", "sect");
      s.dataset.sec = id;
      const h = el("h2", "", title);
      h.append(el("span", "", n));
      s.append(h, el("p", "empty", msg));
      return s;
    }
    const ret = el("section", "sect");
    ret.dataset.sec = "return";
    ret.innerHTML = '<h2>반품/교환정보</h2><table class="kv"><tbody>'
      + '<tr><th scope="row">반품배송비</th><td class="ph">판매자 입력</td></tr>'
      + '<tr><th scope="row">교환배송비</th><td class="ph">판매자 입력</td></tr>'
      + '<tr><th scope="row">보내실 곳</th><td class="ph">판매자 입력</td></tr>'
      + '<tr><th scope="row">상호명</th><td>나인어클락</td></tr>'
      + '<tr><th scope="row">고객센터</th><td class="ph">판매자 입력</td></tr></tbody></table>';

    page.append(top, el("div", "gapband"), tabs, dsec,
      sect("review", "리뷰", "0", "아직 작성된 리뷰가 없습니다."),
      sect("qna", "Q&A", "0", "등록된 문의가 없습니다."),
      ret, el("p", "pfoot", "시안 미리보기 화면이에요. 실제 판매 페이지가 아니에요."));
    pages.append(page);
  }

  function refit() {
    // 접힌 높이: 상세 3,000px(가로 848px 기준)을 지금 화면 폭에 맞춰 줄인다
    const d = document.querySelector("#pg-" + cur + " .detail");
    if (d && d.clientWidth) d.style.setProperty("--fold", Math.round(d.clientWidth * 3000 / 848) + "px");
  }

  function tick() {
    totop.hidden = window.scrollY < 600;
    const page = document.getElementById("pg-" + cur);
    if (!page) return;
    const tabs = page.querySelector(".tabs");
    const line = tabs.offsetHeight + 8;
    let on = "detail";
    page.querySelectorAll("[data-sec]").forEach(s => { if (s.getBoundingClientRect().top <= line) on = s.dataset.sec; });
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) on = "return";   // 맨 아래에서는 마지막 탭
    tabs.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.to === on)));
  }

  function show(key) {
    if (key === cur) return;
    if (cur) {
      pos[cur] = window.scrollY;
      document.getElementById("pg-" + cur).hidden = true;
    }
    cur = key;
    document.getElementById("pg-" + key).hidden = false;
    KEYS.forEach(k => document.getElementById("p-" + k).setAttribute("aria-pressed", String(k === key)));
    document.querySelectorAll("#vseg a").forEach(a => { a.href = a.dataset.base + "#" + key; });
    refit();
    window.scrollTo(0, pos[key] || 0);
    tick();
  }

  function go(key) {
    show(key);
    try { if (location.hash !== "#" + key) location.hash = key; } catch (e) {}
  }

  function setView(v) {
    col.classList.toggle("pc", v === "pc");
    document.getElementById("v-phone").setAttribute("aria-pressed", String(v !== "pc"));
    document.getElementById("v-pc").setAttribute("aria-pressed", String(v === "pc"));
    refit();
    window.scrollTo(0, 0);
    tick();
  }

  function fromHash() {
    const h = location.hash.slice(1);
    return KEYS.includes(h) ? h : KEYS[0];
  }

  // 색감(A·B) 전환: 색감별 묶음으로 올릴 때만 보인다
  if (VARIANT) {
    const home = document.getElementById("home");
    home.href = VARIANT.home;
    home.hidden = false;
    const seg = document.getElementById("vseg");
    VARIANT.items.forEach(it => {
      const a = el("a", "", it.label);
      a.dataset.base = it.href;
      a.href = it.href;
      if (it.k === VARIANT.cur) a.setAttribute("aria-current", "page");
      seg.append(a);
    });
    seg.hidden = false;
  }

  const snav = document.getElementById("snav");
  KEYS.forEach(k => {
    build(k);
    const b = el("button", "", DATA[k].name);
    b.type = "button";
    b.id = "p-" + k;
    b.addEventListener("click", () => { pos[k] = 0; go(k); });
    snav.append(b);
  });
  document.querySelectorAll(".act").forEach(b => b.addEventListener("click", notYet));
  totop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: calm ? "auto" : "smooth" }));
  document.getElementById("v-phone").addEventListener("click", () => setView("phone"));
  document.getElementById("v-pc").addEventListener("click", () => setView("pc"));
  window.addEventListener("hashchange", () => show(fromHash()));
  let queued = false;
  window.addEventListener("scroll", () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; tick(); });
  }, { passive: true });
  window.addEventListener("resize", () => { refit(); tick(); });
  show(fromHash());
</script>

</body>
</html>
